[project]
name = "planeopt"
version = "0.1.0"
description = "General-purpose small-aircraft MDO: co-optimize geometry, mass, and trim for a mission-declared objective (AeroSandbox-based)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "MoZ200701", email = "mzhou07011@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aerosandbox>=4.2.10",
    "jinja2>=3.1.6",
    "plotly>=6.9.0",
    "typer>=0.27.0",
]

[project.optional-dependencies]
# CAD round-trip (.STEP import): OpenCascade kernel — heavy, so opt-in.
cad = [
    "cadquery>=2.4",
]
# Desktop GUI (M5). Opt-in so a CLI-only or headless install stays light.
# pyside6-essentials, not the pyside6 meta-package: we need Core/Gui/Widgets
# only, and the addons (WebEngine, 3D, Charts, Multimedia) are hundreds of MB
# that would land in the .exe for nothing — reports open in the system browser.
gui = [
    "pyside6-essentials>=6.8",
]

[project.scripts]
planeopt = "planeopt.cli:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# `solve` marks tests that run a real NLP. One of them holds ~12 GB for many
# minutes, which is enough to push this machine into swap and is not something a
# bare `pytest` should ever start by surprise. They are deselected by default and
# run explicitly with `-m solve` (or `-m "solve or not solve"` for everything).
#
# `slow` marks the two end-to-end M1 tests. Neither optimizes anything — the
# time is report rendering, and between them they were ~20 minutes of a suite
# that is otherwise about a minute, which is long enough that the suite stops
# being something you run after every edit. Deselected with the same default and
# run with `-m slow`; CI should use `-m "slow or not slow"`.
addopts = "-m 'not solve and not slow'"
markers = [
    "solve: runs a full optimizer solve — minutes of runtime and GB of RAM",
    "slow: minutes of runtime, but no NLP and no large memory footprint",
]
