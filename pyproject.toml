[project]
name = "planeopt"
version = "0.1.0"
description = "General-purpose small-aircraft MDO: co-optimize geometry, mass, and trim for a mission-declared objective (AeroSandbox-based)"
readme = "README.md"
authors = [
    { name = "MoZ200701", email = "mzhou07011@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aerosandbox>=4.2.10",
    "jinja2>=3.1.6",
    "typer>=0.27.0",
]

[project.scripts]
planeopt = "planeopt.cli:app"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
