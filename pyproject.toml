[project]
name = "planeopt"
version = "0.1.0"
description = "General-purpose small-aircraft MDO: co-optimize geometry, mass, and trim for a mission-declared objective (AeroSandbox-based)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "MoZ200701", email = "mzhou07011@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aerosandbox>=4.2.10",
    "jinja2>=3.1.6",
    "plotly>=6.9.0",
    "typer>=0.27.0",
]

[project.optional-dependencies]
# CAD round-trip (.STEP import): OpenCascade kernel — heavy, so opt-in.
cad = [
    "cadquery>=2.4",
]
# Desktop GUI (M5). Opt-in so a CLI-only or headless install stays light.
# pyside6-essentials, not the pyside6 meta-package: we need Core/Gui/Widgets
# only, and the addons (WebEngine, 3D, Charts, Multimedia) are hundreds of MB
# that would land in the .exe for nothing — reports open in the system browser.
gui = [
    "pyside6-essentials>=6.8",
]

[project.scripts]
planeopt = "planeopt.cli:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# `solve` marks tests that run a real NLP. One of them holds ~12 GB for many
# minutes, which is enough to push this machine into swap and is not something a
# bare `pytest` should ever start by surprise. They are deselected by default and
# run explicitly with `-m solve` (or `-m "solve or not solve"` for everything).
#
# What `-m solve` COSTS, measured on the 16 GB Mac (2026-08-06), because "minutes
# of runtime" was the estimate and it was wrong by an order of magnitude:
#
#   test_a_real_run_writes_frames_and_relocates_them   1 h 39 min -> ~2 min
#   test_m3_optimize_smoke                             ~80-130 min, unchanged
#
# The first was an accident and is fixed at the test: it ran ~10 members to
# convergence, wrote 1,062 frames, and then rendered every one of them through
# Qt to prove a frame stream replays. It now passes `max_iter=3`, which is the
# economy FINDINGS §24.2 added the flag for.
#
# The second is NOT an accident and must not be "fixed" the same way. It is the
# M3 gate: it asserts a CONVERGED champion (static margin inside its window,
# trim inside its throws, a negative shadow price), and every one of those
# assertions is meaningless on a truncated solve. Its cost is ~10 real solves —
# `multistart=1, flatness=False` still runs the prop screen, the discrete
# studies, the winglet study and the 5-member re-solve battery. Budget an hour,
# do not run it alongside anything, and expect ~60% CPU efficiency on a machine
# this size: the rest goes to memory compression (FINDINGS §23.4).
#
# `slow` marks the end-to-end M1 tests. Neither optimizes anything — the
# time is report rendering, and between them they were ~20 minutes of a suite
# that is otherwise about a minute, which is long enough that the suite stops
# being something you run after every edit. Deselected with the same default and
# run with `-m slow`; CI should use **`-m "not solve"`** for everything else.
#
# NOT `-m "slow or not slow"`, which this line recommended until 2026-08-06.
# That expression is a tautology: it matches every test, silently re-enabling
# the `solve` tests the paragraph above exists to keep off a bare run. It
# collects 454 of 454. Two of those runs started at once will sit on ~9 GB each
# and take the machine into swap — which is precisely the surprise the default
# was written to prevent, arriving through the command that documents it.
# Marker expressions are not selection lists: `not solve` is the one that
# actually subtracts something.
addopts = "-m 'not solve and not slow'"
markers = [
    "solve: runs a full optimizer solve — minutes of runtime and GB of RAM",
    "slow: minutes of runtime, but no NLP and no large memory footprint",
]
